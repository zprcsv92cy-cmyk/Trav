name: Bearbeta V85-startlistor
on:
  push:
    paths:
      - 'data/startlistor.csv'
      - 'scripts/build_startlists.py'
      - '.github/workflows/startlistor.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validera och skapa JSON
        run: python scripts/build_startlists.py
      - name: Publicera JSON om ändrad
        run: |
          if ! git diff --quiet -- data/startlistor.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/startlistor.json
            git commit -m "Uppdatera V85-startlistor JSON"
            git push
          fi
